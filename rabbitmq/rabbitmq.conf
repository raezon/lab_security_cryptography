# =============================================================================
#  RabbitMQ — broker d'ingestion DataCorp Secure
#  AMQP et API de management exposés UNIQUEMENT en TLS.
# =============================================================================
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile           = /certs/rabbitmq/ca.crt
ssl_options.certfile             = /certs/rabbitmq/server.crt
ssl_options.keyfile              = /certs/rabbitmq/server.key
ssl_options.verify               = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1           = tlsv1.3
ssl_options.versions.2           = tlsv1.2

management.ssl.port       = 15671
management.ssl.cacertfile = /certs/rabbitmq/ca.crt
management.ssl.certfile   = /certs/rabbitmq/server.crt
management.ssl.keyfile    = /certs/rabbitmq/server.key
# Même exigence de version que l'AMQPS : sans ces lignes, le port 15671 acceptait TLS 1.1 (CBC-SHA)
management.ssl.versions.1 = tlsv1.3
management.ssl.versions.2 = tlsv1.2

# Le compte "guest" ne doit jamais être utilisable à distance
loopback_users.guest = true

log.console = true
log.console.level = info
# Journal des connexions / authentifications (TP3)
log.connection.level = info
