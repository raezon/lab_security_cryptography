# =============================================================================
#  DataCorp Secure — pg_hba.conf
#  Ordre = priorité : la première ligne qui correspond s'applique.
# =============================================================================
# TYPE      DATABASE   USER       ADDRESS        METHOD

# Administration locale uniquement depuis le conteneur, en tant qu'utilisateur
# système "postgres" (docker compose exec -u postgres postgres psql)
local       all        postgres                  peer

# Tout accès réseau DOIT être chiffré (TLS) et authentifié par SCRAM
hostssl     all        all        0.0.0.0/0      scram-sha-256
hostssl     all        all        ::/0           scram-sha-256

# Toute connexion réseau NON chiffrée est refusée explicitement
hostnossl   all        all        0.0.0.0/0      reject
hostnossl   all        all        ::/0           reject
